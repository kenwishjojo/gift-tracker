<h1>Upcoming occasions</h1>

<div class="os-stack">
  @for (occasion of upcoming; track occasion.id) {
    <app-occasion-card [occasion]="occasion" [recipient]="findProfile(occasion.recipientId)"
                       [gifts]="giftsFor(occasion)" [meId]="meId" />
  } @empty {
    <p>No upcoming occasions. Enjoy the calm.</p>
  }
</div>

@if (past.length > 0) {
  <h2>Past occasions</h2>
  <div class="os-stack">
    @for (occasion of past; track occasion.id) {
      <app-occasion-card [occasion]="occasion" [recipient]="findProfile(occasion.recipientId)"
                         [gifts]="giftsFor(occasion)" [meId]="meId" />
    }
  </div>
}
