<!-- Placeholder layout – the real design comes from the brand book -->
<h1>Occasions</h1>
<ul>
  @for (occasion of occasions; track occasion.id) {
    <li>
      <a [routerLink]="['/occasion', occasion.id]">{{ occasion.name }}</a>
      – {{ occasion.eventDate }} ({{ occasion.type }})
    </li>
  } @empty {
    <li>No occasions yet.</li>
  }
</ul>
