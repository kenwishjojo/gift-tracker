@if (profile) {
  <h1 class="os-display">Hi {{ profile.fullName.split(' ')[0] }}</h1>
  <p>Keep track of the gifts for everyone you care about: occasions, gift ideas and what is already bought.</p>

  <div class="os-row">
    <a class="os-btn os-btn--primary" routerLink="/occasions">See occasions</a>
    <a class="os-btn" [routerLink]="['/profile', profile.id]">My profile</a>
  </div>
}
